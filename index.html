<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח גיוס תרומות - בניין</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    /* כפתור תצוגה מקדימה עליון */
    .preview-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }

    .preview-btn:hover {
      background-color: #0056b3;
    }

    /* מיכל ראשי לתמונות */
    .building-container {
      position: relative;
      width: 800px;
      max-width: 100%;
      height: 600px;
      margin: 0 auto;
      border: 3px solid #333;
      overflow: hidden;
      /* תמונת הרקע: ההדמיה המוגמרת */
      background-image: url('rendering.jpg'); 
      background-size: cover;
      background-position: center;
    }

    /* רשת הקוביות */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(10, 1fr);
      z-index: 2;
    }

    /* עיצוב כל קובייה ברשת + הגדרת קווים בולטים */
    .tile {
      /* קווים בולטים סביב כל קובייה */
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      
      background-image: url('building_now.jpg');
      background-size: 800px 600px;
      background-repeat: no-repeat;
      
      /* מעבר חלק ושקט לחשיפה ולחזרה */
      transition: opacity 1.5s ease;
      cursor: pointer;
    }

    /* קובייה שנתרמה לצמיתות */
    .tile.revealed {
      opacity: 0;
      pointer-events: none;
    }

    /* תצוגה מקדימה זמנית לקובייה בודדת או לכל הלוח */
    .tile.preview-active {
      opacity: 0;
    }
  </style>
</head>
<body>

  <h1>קמפיין גיוס לבניין הקהילתי</h1>
  <p>כל תרומה חושפת חלק מההדמיה!</p>

  <!-- כפתור לחשיפה זמנית של כל ההדמיה -->
  <button class="preview-btn" id="previewAllBtn">הצג הדמיה מלאה ל-3 שניות</button>

  <div class="building-container">
    <div class="grid-overlay" id="grid"></div>
  </div>

  <script>
    const gridContainer = document.getElementById('grid');
    const previewAllBtn = document.getElementById('previewAllBtn');
    
    const cols = 20;
    const rows = 10;
    const totalTiles = cols * rows;

    const tileWidth = 800 / cols;
    const tileHeight = 600 / rows;
    
    const tileElements = [];

    // יצירת הקוביות והגדרת המיקומים
    for (let i = 0; i < totalTiles; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');

      const col = i % cols;
      const row = Math.floor(i / cols);

      const posX = col * tileWidth;
      const posY = row * tileHeight;
      tile.style.backgroundPosition = `-${posX}px -${posY}px`;

      // בלחיצה על קובייה: חשיפה זמנית לשנייה אחת בלבד
      tile.addEventListener('click', () => {
        if (!tile.classList.contains('revealed')) {
          tile.classList.add('preview-active');
          
          setTimeout(() => {
            tile.classList.remove('preview-active');
          }, 1000); // 1000 מילישניות = שנייה אחת
        }
      });

      gridContainer.appendChild(tile);
      tileElements.push(tile);
    }

    // בלחיצה על הכפתור העליון: חשיפת כל הלוח והחזרה הדרגתית
    previewAllBtn.addEventListener('click', () => {
      // 1. חשיפת כל הקוביות
      tileElements.forEach(tile => {
        if (!tile.classList.contains('revealed')) {
          tile.classList.add('preview-active');
        }
      });

      // 2. השהייה של 3 שניות ואז החזרה הדרגתית לשכבת הבנייה
      setTimeout(() => {
        tileElements.forEach(tile => {
          tile.classList.remove('preview-active');
        });
      }, 3000);
    });
  </script>
</body>
</html>
