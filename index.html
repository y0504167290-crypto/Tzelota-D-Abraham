<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפיין גיוס</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .preview-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }

    .preview-btn:hover {
      background-color: #0056b3;
    }

    .building-container {
      position: relative;
      width: 800px;
      height: 600px;
      margin: 0 auto;
      border: 3px solid #333;
      overflow: hidden;
      /* תמונת ההדמיה ברקע */
      background-image: url('רינדור.jpg.jpg'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #e0e0e0;
    }

    /* תמונת הבנייה הרציפה - מונעת עיוותים לחלוטין */
    .top-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      transition: opacity 0.5s ease;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(10, 1fr);
      z-index: 2;
    }

    .tile {
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.2);
      background-color: transparent;
      cursor: pointer;
    }

    /* כשהקוביות גלויות/פעילות */
    .tile.preview-active {
      background-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <h1>קמפיין גיוס לבניין הקהילתי</h1>
  <p>כל תרומה חושפת חלק מההדמיה!</p>

  <button class="preview-btn" id="previewAllBtn">הצג הדמיה מלאה ל-3 שניות</button>

  <div class="building-container">
    <!-- תמונת הבנייה העליונה -->
    <img src="building_now.jpg" class="top-image" id="topImg" alt="מצב קיים">
    <!-- רשת הקוביות -->
    <div class="grid-overlay" id="grid"></div>
  </div>

  <script>
    const gridContainer = document.getElementById('grid');
    const previewAllBtn = document.getElementById('previewAllBtn');
    const topImg = document.getElementById('topImg');

    const cols = 20;
    const rows = 10;
    const totalTiles = cols * rows;

    for (let i = 0; i < totalTiles; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');

      // בלחיצה על קובייה: הסתרת התמונה העליונה לשנייה אחת
      tile.addEventListener('click', () => {
        topImg.style.opacity = '0';
        tile.classList.add('preview-active');

        setTimeout(() => {
          topImg.style.opacity = '1';
          tile.classList.remove('preview-active');
        }, 1000);
      });

      gridContainer.appendChild(tile);
    }

    // כפתור חשיפה מלאה ל-3 שניות
    previewAllBtn.addEventListener('click', () => {
      topImg.style.opacity = '0';

      setTimeout(() => {
        topImg.style.opacity = '1';
      }, 3000);
    });
  </script>
</body>
</html>
