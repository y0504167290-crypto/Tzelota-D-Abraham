<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפיין גיוס לבניין</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .preview-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }

    .preview-btn:hover {
      background-color: #0056b3;
    }

    .building-container {
      position: relative;
      width: 800px;
      height: 600px;
      margin: 0 auto;
      border: 3px solid #333;
      overflow: hidden;
      /* תמונת ההדמיה התחתונה ברקע */
      background-image: url('rendering.jpg'); 
      background-size: 800px 600px;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #ddd;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(10, 1fr);
    }

    .tile {
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.2);
      /* תמונת הבנייה מולבשת על כל קובייה בנפרד לפי מיקומה */
      background-image: url('building_now.jpg');
      background-size: 800px 600px;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    /* קובייה שנלחצה הופכת לשקופה ומראה את ההדמיה שמתחתיה */
    .tile.revealed {
      opacity: 0;
    }
  </style>
</head>
<body>

  <h1>קמפיין גיוס לבניין</h1>
  <p>כל תרומה חושפת חלק מההדמיה!</p>

  <button class="preview-btn" id="previewAllBtn">הצג הדמיה מלאה ל-3 שניות</button>

  <div class="building-container">
    <div class="grid-overlay" id="grid"></div>
  </div>

  <script>
    const gridContainer = document.getElementById('grid');
    const previewAllBtn = document.getElementById('previewAllBtn');

    const cols = 20;
    const rows = 10;
    const totalTiles = cols * rows;
    const tileElements = [];

    // יצירת 200 הקוביות וחישוב מיקום הרקע המדויק לכל קובייה
    for (let i = 0; i < totalTiles; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');

      const col = i % cols;
      const row = Math.floor(i / cols);

      // מיקום הרקע של הקובייה (בפיקסלים לפי גודל הלוח 800x600)
      const posX = col * (800 / cols);
      const posY = row * (600 / rows);
      tile.style.backgroundPosition = `-${posX}px -${posY}px`;

      // בלחיצה על קובייה: חשיפה של ההדמיה בדיוק מתחתיה לשנייה אחת
      tile.addEventListener('click', () => {
        tile.classList.add('revealed');
        setTimeout(() => {
          tile.classList.remove('revealed');
        }, 1000);
      });

      gridContainer.appendChild(tile);
      tileElements.push(tile);
    }

    // כפתור תצוגה מקדימה מלאה ל-3 שניות
    previewAllBtn.addEventListener('click', () => {
      tileElements.forEach(tile => tile.classList.add('revealed'));
      setTimeout(() => {
        tileElements.forEach(tile => tile.classList.remove('revealed'));
      }, 3000);
    });
  </script>
</body>
</html>
