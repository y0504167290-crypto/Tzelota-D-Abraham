<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדמיה ומבנה</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
        .image-card {
            position: relative;
            width: 100%;
            height: 450px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
            /* ברירת המחדל - הבניין כיום */
            background-image: url('building_now.jpg');
        }
        /* כשהעכבר עובר או בלחיצה - התמונה מתחלפת להדמיה */
        .image-card:hover, .image-card:active {
            background-image: url('רינדור.jpg.jpg');
        }
        .instructions {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-card" id="imageCard"></div>
        <p class="instructions">העבר את העכבר (או לחץ במסך מגע) על התמונה כדי לראות את ההדמיה</p>
    </div>

</body>
</html>
