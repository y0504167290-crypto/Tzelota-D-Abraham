<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמפיין גיוס לבניין</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .preview-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }

    .preview-btn:hover {
      background-color: #0056b3;
    }

    .building-container {
      position: relative;
      width: 800px;
      height: 600px;
      margin: 0 auto;
      border: 3px solid #333;
      overflow: hidden;
      /* תמונת ההדמיה התחתונה - מותאמת לשם הקובץ הנוכחי */
      background-image: url('רינדור.jpg.jpg'); 
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #ddd;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(10, 1fr);
    }

    .tile {
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.2);
      /* התאמת גודל הרקע באחוזים למניעת חיתוכים ופסים */
      background-image: url('building_now.jpg');
      background-size: 2000% 1000%;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: opacity 0.3s ease;
      opacity: 1;
    }

    .tile.revealed {
      opacity: 0;
    }
  </style>
</head>
<body>

  <h1>קמפיין גיוס לבניין</h1>
  <p>כל תרומה חושפת חלק מההדמיה!</p>

  <button class="preview-btn" id="previewAllBtn">הצג הדמיה מלאה ל-3 שניות</button>

  <div class="building-container">
    <div class="grid-overlay" id="grid"></div>
  </div>

  <script>
    const gridContainer = document.getElementById('grid');
    const previewAllBtn = document.getElementById('previewAllBtn');

    const cols = 20;
    const rows = 10;
    const totalTiles = cols * rows;
    const tileElements = [];

    for (let i = 0; i < totalTiles; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');

      const col = i % cols;
      const row = Math.floor(i / cols);

      // חישוב מיקום הרקע באחוזים למניעת סטייה בקוביות
      const posX = (col / (cols - 1)) * 100;
      const posY = (row / (rows - 1)) * 100;
      tile.style.backgroundPosition = `${posX}% ${posY}%`;

      tile.addEventListener('click', () => {
        tile.classList.add('revealed');
        setTimeout(() => {
          tile.classList.remove('revealed');
        }, 1000);
      });

      gridContainer.appendChild(tile);
      tileElements.push(tile);
    }

    previewAllBtn.addEventListener('click', () => {
      tileElements.forEach(tile => tile.classList.add('revealed'));
      setTimeout(() => {
        tileElements.forEach(tile => tile.classList.remove('revealed'));
      }, 3000);
    });
  </script>
</body>
</html>
